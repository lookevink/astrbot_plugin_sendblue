name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/checkout@v7
        with:
          repository: AstrBotDevs/AstrBot
          ref: 42972e932a64f01d96e2e0708579b0f79dd6f792
          path: host
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      # The pinned AstrBot revision does not commit a uv.lock file.
      - run: uv sync --group dev
        working-directory: host
      - run: ../host/.venv/bin/ruff check . && ../host/.venv/bin/ruff format --check .
        working-directory: plugin
      - name: Plugin loader, lifecycle and message-path tests
        working-directory: plugin
        env:
          ASTRBOT_TEST_HOST: ${{ github.workspace }}/host
        run: ../host/.venv/bin/python -m pytest tests -q
